services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hola
      POSTGRES_PASSWORD: hola
      POSTGRES_DB: hola
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hola -d hola"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: ./apps/api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://hola:hola@db:5432/hola?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
