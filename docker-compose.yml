name: hola

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hola
      POSTGRES_PASSWORD: hola
      POSTGRES_DB: hola
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hola -d hola"]
      interval: 2s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://hola:hola@db:5432/hola?sslmode=disable
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: hola
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: greeting.events
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy

  relay:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["relay"]
    environment:
      DATABASE_URL: postgres://hola:hola@db:5432/hola?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: greeting.events
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  projector:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["projector"]
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: hola
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: greeting.events
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages/api-client/src:/app/packages/api-client/src
    depends_on:
      api:
        condition: service_healthy

  mobile:
    profiles: ["mobile"]
    build:
      context: .
      dockerfile: docker/mobile.Dockerfile
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8080}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP:-localhost}
    volumes:
      - ./apps/mobile:/app/apps/mobile
      - ./packages/api-client/src:/app/packages/api-client/src
    depends_on:
      api:
        condition: service_healthy

  api-test:
    profiles: ["test"]
    image: golang:1.22-alpine
    working_dir: /src
    volumes:
      - ./apps/api:/src
      - go-mod:/go/pkg/mod
    command: go test ./...

  client-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/client-test.Dockerfile

volumes:
  pgdata:
  mongodata:
  go-mod:
